name: Apply AI task center integration

on:
  push:
    branches:
      - feature/glm-analysis-queue
    paths:
      - .github/workflows/apply-ai-task-center.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/glm-analysis-queue

      - name: Apply integration patches
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # 1) 生命周期服务：只负责创建任务，执行交给统一 runner
          path = Path('src/features/upload-workspace/application/create-upload-file-lifecycle-service.js')
          text = path.read_text()
          pattern = re.compile(r"    async analyzeFiles\(uploadFiles, \{ series, provider, credentials, modelKey \}\) \{.*?      return \{ analyzedCount \}\n    \}", re.S)
          replacement = '''    async analyzeFiles(uploadFiles, { series, provider, modelKey }) {
      const taskStore = useAiTasksStore()
      await taskStore.initialize()

      const queue = uploadFiles.filter(file => !file.aiMetadata)
      for (const uploadFile of queue) {
        let task = taskStore.getTaskByFileId(uploadFile.id)
        if (!task) {
          task = await taskStore.createTask({
            fileId: uploadFile.id,
            file: uploadFile.file,
            series,
            provider,
            modelKey
          })
        }

        uploadFile.aiTaskId = task.id
        uploadFile.aiTaskStatus = task.status
        uploadFile.aiTaskAttempts = task.attempts || 0
      }

      const { resumeAiTaskQueue } = await import('@/services/ai/task-runner')
      await resumeAiTaskQueue()
      return { analyzedCount: queue.length }
    }'''
          text, count = pattern.subn(replacement, text)
          if count != 1:
            raise SystemExit(f'Expected 1 lifecycle replacement, got {count}')
          # 清理不再使用的 helper/import
          text = text.replace("import { AI_TASK_STATUS, useAiTasksStore } from '@/stores/ai-tasks'", "import { useAiTasksStore } from '@/stores/ai-tasks'")
          text = re.sub(r"\nfunction buildAiMetadata\(.*?\n\}\n\nfunction sleep\(ms\) \{.*?\n\}\n", "\n", text, flags=re.S)
          path.write_text(text)

          # 2) UploadPanel：嵌入任务中心 + 更新提示
          path = Path('src/components/upload/UploadPanel.vue')
          text = path.read_text()
          marker = '''      <UploadDropzone
        :disabled="dropzoneDisabled"
        :compact="files.length > 0"
        :uploading="uploading"
        :can-add-files="canAddFiles"
        :can-upload="props.canUpload"
        :upload-mode="uploadMode"
        :ai-config="aiConfig"
        :icon="dropzoneIcon"
        :text="dropzoneText"
        @add-files="handleAddFiles"
      />'''
          if marker not in text:
            raise SystemExit('UploadDropzone marker not found')
          text = text.replace(marker, marker + '\n\n      <AITaskCenter v-if="uploadMode === \'ai\' && files.length > 0" />')
          text = text.replace("import UploadDropzone from './UploadPanel/UploadDropzone.vue'", "import UploadDropzone from './UploadPanel/UploadDropzone.vue'\nimport AITaskCenter from './AITaskCenter.vue'")
          old = '''  if (props.uploadMode === 'ai') {
    return props.aiConfig?.provider === 'groq'
      ? '拖拽图片到此处，AI 将自动分类（当前最多 10 张）'
      : '拖拽图片到此处，AI 将自动分类（当前仅支持 1 张）'
  }'''
          new = '''  if (props.uploadMode === 'ai') {
    return '拖拽多张图片到此处，AI 将进入任务队列逐张分析'
  }'''
          if old not in text:
            raise SystemExit('dropzoneText block not found')
          text = text.replace(old, new)
          path.write_text(text)

          # 3) Dropzone：AI 模式不再限制单次选择数量
          path = Path('src/components/upload/UploadPanel/UploadDropzone.vue')
          text = path.read_text()
          text, count = re.subn(
            r"function getBatchLimit\(\) \{.*?\n\}",
            "function getBatchLimit() {\n  return Infinity\n}",
            text,
            count=1,
            flags=re.S
          )
          if count != 1:
            raise SystemExit('getBatchLimit replacement failed')
          path.write_text(text)

          # 4) 上传会话初始化时自动恢复任务并续跑
          path = Path('src/stores/upload-session.js')
          text = path.read_text()
          marker = '''  return {
    files,'''
          auto_resume = '''  Promise.resolve().then(async () => {
    try {
      const restored = await restoreAiTaskFiles()
      if (restored.some(file => !file.aiMetadata)) {
        const { resumeAiTaskQueue } = await import('@/services/ai/task-runner')
        resumeAiTaskQueue().catch(error => {
          console.warn('[UploadSession] AI 任务自动续跑失败:', error)
        })
      }
    } catch (error) {
      console.warn('[UploadSession] AI 任务恢复失败:', error)
    }
  })

'''
          if auto_resume.strip() not in text:
            text = text.replace(marker, auto_resume + marker)
          path.write_text(text)

          # 5) 页面卸载只释放运行时文件，不删除 IndexedDB 任务
          path = Path('src/stores/upload.js')
          text = path.read_text()
          old = '''    sessionCache.cleanup()
    // 清空文件列表
    sessionStore.clearFiles()
  }'''
          new = '''    sessionCache.cleanup()
    // 页面卸载只清空运行时列表；AI 任务由 IndexedDB 持久化，刷新后可恢复
    sessionStore.setFiles([])
  }'''
          if old not in text:
            raise SystemExit('upload cleanup block not found')
          text = text.replace(old, new)
          path.write_text(text)

          # 一次性 workflow 不进入最终 PR
          Path('.github/workflows/apply-ai-task-center.yml').unlink()
          PY

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: wire persistent AI task center" || exit 0
          git push origin HEAD:feature/glm-analysis-queue
